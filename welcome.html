<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bem-vindo</title>
    <style>
      html,body{height:100%;margin:0}
      .bg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
      .bg img{max-width:100%;max-height:100%;object-fit:contain}
      /* fallback text for accessibility */
      .qr-note{position:fixed;right:12px;bottom:12px;color:#fff;font-size:12px;background:rgba(0,0,0,0.4);padding:6px;border-radius:6px}
    </style>
  </head>
  <body>
    <div class="bg">
      <!-- Coloque o arquivo da imagem aqui com o nome 'welcome.jpg' no mesmo diretório -->
      <img src="welcome.jpg" alt="Tela de boas-vindas" />
    </div>
    <div class="qr-note">Caso a imagem não apareça, adicione o arquivo <code>welcome.jpg</code> na pasta do projeto.</div>
  </body>
</html>
